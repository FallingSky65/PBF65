[package]
name = "PBF65"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.35"
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
wgpu = { version = "30.0.1", features = ["webgl"]}
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Document",
    "Window",
    "Element",
]}


[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "PBF65"
path = "src/main.rs"

[lints.rust]
non_snake_case = "allow"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
